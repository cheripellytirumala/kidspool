<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KidsPool</title>
<meta name="description" content="KidsPool: share school and activity rides with verified parents near you.">
<style>
  :root { --ink:#0f0f0f; --muted:#5c5c5c; --lime:#c7ff2e; --surface:#f2f2f2; --bg:#fff; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f2f2f2; --muted:#a8a8a8; --surface:#1c1c1c; --bg:#0f0f0f; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:40px; margin:0 0 8px; letter-spacing:-0.02em; }
  p { color:var(--muted); }
  a.card { display:block; background:var(--surface); border-left:6px solid var(--lime); border-radius:14px; padding:16px 18px; margin:12px 0; color:inherit; text-decoration:none; font-weight:600; }
  footer { margin-top:40px; color:var(--muted); font-size:15px; }
</style>
</head>
<body>
<main>
  <h1>KidsPool</h1>
  <p>Share school and activity rides with verified parents near you.</p>
  <a class="card" href="privacy/">Privacy Policy</a>
  <a class="card" href="child-safety/">Child Safety Standards</a>
  <footer>NFC Solutions · 5th Floor, MR Prime, Survey No. 6, BP Raju Marg, Behind Ratnadeep Super Market, Whitefields, Kondapur, Hyderabad, Telangana 500084, India</footer>
</main>
</body>
</html>
